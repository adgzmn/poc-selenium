name: Run Tests on Pull Request

on:
  pull_request:
    branches: [ main ]
 
jobs:
  SmokeTest:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven
        run: mvn test -DsuiteXmlFile=./src/test/java/testng.xml
    
      - name: Set Date Environment Variable
        run: echo "REPORT_DATE=$(date +'%m.%d')" >> $GITHUB_ENV

      - name: Upload Extent Reports
        uses: actions/upload-artifact@v4
        with:
          name: extentreport-${{ github.run_number }}.html
          path: ./Reports/${{ env.REPORT_DATE }}/*.html
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          overwrite: true